name: Build OrangeFox Recovery

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch (e.g. 12.1, 14.1, 11.0)'
        required: true
        default: '14.1'
        type: choice
        options:
          - '14.1'
          - '12.1'
          - '11.0'
      BUILD_TARGET:
        description: 'Build Target'
        required: true
        default: 'fox_dew-eng'
        type: choice
        options:
          - 'fox_dew-eng'
          - 'twrp_dew-eng'
          - 'orangefox_dew-eng'
          - 'omni_dew-eng'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout Device Tree
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/lib/jvm
          sudo docker image prune -a --force || true
          sudo docker system prune -a --volumes --force || true
          sudo apt-get clean
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32z1-dev libxml2-utils xsltproc unzip \
            python3 python-is-python3 rsync bc gperf libssl-dev \
            libncurses5-dev libncursesw5-dev \
            lz4 cpio liblzma-dev optipng

      - name: Install repo
        run: |
          mkdir -p ~/.local/bin
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o ~/.local/bin/repo
          chmod +x ~/.local/bin/repo
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Sync OrangeFox Sources
        run: |
          git config --global user.name "OrangeFox Builder"
          git config --global user.email "builder@orangefox.tech"
          git config --global color.ui true

          mkdir -p /tmp/sync_tools
          cd /tmp/sync_tools
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH || '14.1' }} --path /tmp/fox

      - name: Copy Device Tree
        run: |
          mkdir -p /tmp/fox/device/xiaomi/dew
          rsync -a \
            --exclude=.git \
            --exclude=.github \
            ./ /tmp/fox/device/xiaomi/dew/

      - name: Build OrangeFox Recovery
        run: |
          cd /tmp/fox
          set +e
          source build/envsetup.sh
          set -e
          echo "=== Lunching target: ${{ github.event.inputs.BUILD_TARGET || 'fox_dew-eng' }} ==="
          lunch ${{ github.event.inputs.BUILD_TARGET || 'fox_dew-eng' }}
          echo "=== Building vendorbootimage ==="
          mka vendorbootimage

      - name: Show Build Output
        if: always()
        run: |
          find /tmp/fox/out/target/product/dew -maxdepth 2 -type f || true

      - name: Fix Permissions
        if: always()
        run: |
          sudo chown -R runner:runner /tmp/fox/out || true
          sudo chmod -R a+rX /tmp/fox/out || true

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-dew
          if-no-files-found: warn
          path: |
            /tmp/fox/out/target/product/dew/OrangeFox*.zip
            /tmp/fox/out/target/product/dew/OrangeFox*.img
            /tmp/fox/out/target/product/dew/vendor_boot.img
            /tmp/fox/out/target/product/dew/vendorboot.img
            /tmp/fox/out/target/product/dew/vendor_ramdisk_recovery.cpio
            /tmp/fox/out/target/product/dew/recovery.img
            /tmp/fox/out/target/product/dew/boot.img